name: Update Sal's Feed

# Runs the aggregator every 20 minutes, every day. Also runnable on demand
# from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run aggregator
        run: python aggregate.py

      - name: Commit and push if the feed changed
        run: |
          git config user.name "sals-feed-bot"
          git config user.email "sals-feed-bot@users.noreply.github.com"
          git add feed.xml state.json
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
